[package]
name = "ls50stream"
version = "0.5.0"
edition = "2021"
authors = ["Kai Hagseth"]
license = "GPL-3.0-or-later"
repository = "https://github.com/kaihagseth/ls50stream"
description = "ls50streamd: streams the LS50Stream audio device to DLNA speakers"
publish = false

[[bin]]
name = "ls50streamd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[profile.release]
lto = true
codegen-units = 1
